<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Para ti 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse at 50% 36%,#fde6ef 0%,#f9c8dc 52%,#f1a8c6 100%);
    font-family:'Cormorant Garamond',Georgia,serif;color:#6b3a52;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .hint{font-family:'Great Vibes',cursive;font-size:1.9rem;color:#d6336c;text-shadow:0 2px 10px #fff9;height:44px;text-align:center;transition:opacity .6s;padding:0 12px}
  .hint.hide{opacity:0}

  /* ===== escenario ===== */
  .stage{--s:clamp(100px,min(36vw,19vh),150px);position:relative;width:min(96vw,440px);height:min(72vh,540px);cursor:pointer}
  .ped{position:absolute;left:0;right:0;bottom:7%;aspect-ratio:2.7/1}
  .ped i{position:absolute;left:0;right:0;border-radius:50%}
  .ped .r1{top:22px;bottom:-22px;background:linear-gradient(#ff80bb,#e23c97);box-shadow:0 18px 26px #d0357a55}
  .ped .r2{top:11px;bottom:-11px;background:#fff0f6}
  .ped .tp{top:0;bottom:0;background:radial-gradient(ellipse at 50% 38%,#fff 0%,#f7ebf1 62%,#e7cfdc 100%)}
  .shadow{position:absolute;left:44%;top:calc(66% + var(--s)*.2);width:calc(var(--s)*1.9);height:calc(var(--s)*.7);margin-left:calc(var(--s)*-.95);border-radius:50%;background:rgba(120,60,95,.30);filter:blur(12px);transform:rotate(-8deg)}

  /* ===== caja 3D ===== */
  .persp{position:absolute;left:50%;top:66%;width:0;height:0;perspective:900px}
  .cube{position:absolute;width:var(--s);height:var(--s);left:calc(var(--s)/-2);top:calc(var(--s)/-2);transform-style:preserve-3d;animation:swing 10s ease-in-out infinite}
  @keyframes swing{0%,100%{transform:rotateX(-24deg) rotateY(-32deg)}50%{transform:rotateX(-24deg) rotateY(32deg)}}
  .f{position:absolute;inset:0;background:linear-gradient(160deg,#ffa3c6,#f2679a)}
  .f.side::before{content:"";position:absolute;left:43%;width:14%;top:0;bottom:0;background:linear-gradient(90deg,#ffc3db,#ffe3ee,#ffc3db)}
  .front{transform:translateZ(calc(var(--s)/2))}
  .back{transform:rotateY(180deg) translateZ(calc(var(--s)/2));filter:brightness(.9)}
  .right{transform:rotateY(90deg) translateZ(calc(var(--s)/2));filter:brightness(.94)}
  .left{transform:rotateY(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.88)}
  .bottom{transform:rotateX(-90deg) translateZ(calc(var(--s)/2));background:#c93a78}
  .dec{position:absolute;width:25%;aspect-ratio:1;filter:drop-shadow(0 1.5px 1.5px rgba(150,30,80,.4))}
  .dec svg{width:100%;height:100%;display:block}

  .lidwrap{position:absolute;left:0;top:0;width:var(--s);height:0;transform-style:preserve-3d;transform-origin:50% 0;
    transform:translateZ(calc(var(--s)/-2)) rotateX(0deg);transition:transform 1.2s cubic-bezier(.3,1.25,.4,1)}
  .open .lidwrap{transform:translateZ(calc(var(--s)/-2)) rotateX(98deg)}
  .lid{position:absolute;left:0;top:0;width:var(--s);height:var(--s);transform-origin:50% 0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .lid.out{transform:rotateX(90deg);background:linear-gradient(160deg,#ffaccb,#f4709f)}
  .lid.out::before{content:"";position:absolute;left:43%;width:14%;top:0;bottom:0;background:linear-gradient(90deg,#ffc3db,#ffe3ee,#ffc3db)}
  .lid.out::after{content:"";position:absolute;top:43%;height:14%;left:0;right:0;background:linear-gradient(#ffc3db,#ffe3ee,#ffc3db)}
  .lid.in{transform:rotateX(90deg) rotateY(180deg);background:#fff3f8;border:calc(var(--s)*.05) solid #ff8fb8;display:grid;place-items:center}
  .lid.in svg{width:62%;transform:rotate(180deg)}
  .bow3d{position:absolute;left:50%;top:0;width:calc(var(--s)*1.02);transform:translate(-50%,-70%) translateZ(calc(var(--s)/2));transition:opacity .35s}
  .bow3d svg{width:100%;display:block;filter:drop-shadow(0 4px 4px #b0306a44)}
  .open .bow3d{opacity:0}

  /* ===== ramo ===== */
  .bouquet{position:absolute;left:50%;top:calc(66% + var(--s)*.56);width:calc(var(--s)*1.5);transform-origin:50% 100%;
    transform:translate(-50%,-100%) translateY(50%) scale(.3);opacity:0;pointer-events:none;
    transition:transform 1.6s cubic-bezier(.2,1.15,.3,1),opacity .6s}
  .bouquet.show{transform:translate(-50%,-100%);opacity:1}
  .bouquet svg{width:100%;display:block;filter:drop-shadow(0 8px 8px #b0306a44)}
  .bouquet .sw{animation:sway 5s ease-in-out infinite alternate;transform-origin:50% 100%}
  @keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}

  .burst{position:absolute;left:50%;top:calc(66% - var(--s)*.2);width:0;height:0;pointer-events:none;z-index:5}
  .bf{position:absolute;left:0;top:0;opacity:0;filter:drop-shadow(0 4px 5px #8f1f5a44)}
  .bf svg{width:100%;height:100%;display:block}
  .floaters{position:absolute;inset:0;pointer-events:none}
  .fl{position:absolute;opacity:0;transition:opacity 1.6s;animation:bob 4.5s ease-in-out infinite alternate}
  .fl.show{opacity:1}
  .fl svg{width:100%;height:100%;display:block}
  @keyframes bob{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(8px,-16px) rotate(10deg)}}
  .petal{position:fixed;top:-30px;pointer-events:none;border-radius:70% 0 70% 0;opacity:.6}

  /* ===== carta ===== */
  .veil{position:fixed;inset:0;z-index:50;background:rgba(120,50,85,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .6s}
  .veil.show{opacity:1;pointer-events:auto}
  .card{position:relative;width:min(88vw,380px);text-align:center;padding:40px 24px 24px;border-radius:16px;
    background:linear-gradient(#fff,#ffeef5);border:1px solid #fff;box-shadow:0 26px 60px rgba(100,20,60,.45),0 0 0 6px rgba(255,255,255,.25);
    transform:translateY(24px) scale(.94);transition:transform .7s cubic-bezier(.2,1.2,.4,1)}
  .veil.show .card{transform:none}
  .badge{position:absolute;left:50%;top:-22px;margin-left:-22px;width:44px;height:44px;border-radius:50%;background:linear-gradient(#ff5c9a,#d81b72);color:#fff;display:grid;place-items:center;font-size:1.25rem;box-shadow:0 6px 14px rgba(216,27,114,.5)}
  .x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;border:1px solid #f3c3d6;background:#fff8;color:#b0456f;font-size:.85rem;cursor:pointer}
  .card small{display:block;font-family:'Cormorant Garamond',serif;font-size:.62rem;letter-spacing:.22em;color:#b0587c;font-weight:500}
  .card h2{font-family:'Playfair Display',serif;font-weight:600;font-size:1.5rem;color:#a3144f;margin:6px 0 8px}
  .card hr{width:52px;border:0;height:2px;background:#c9396f;margin:0 auto 10px;border-radius:2px}
  .card .para{font-style:italic;font-weight:500;font-size:1.04rem;line-height:1.55;padding:10px 6px;border-bottom:1px solid rgba(214,150,175,.35)}
  .card .firma{font-family:'Great Vibes',cursive;font-size:1.8rem;color:#c2185b;text-align:right;margin:8px 6px 12px}
  .btn{border:0;background:linear-gradient(#ff6aa2,#e0286f);color:#fff;font:600 .9rem 'Cormorant Garamond',serif;letter-spacing:.03em;padding:11px 26px;border-radius:999px;cursor:pointer;box-shadow:0 8px 18px rgba(224,40,111,.45)}
  .btn:active{transform:scale(.97)}
  .rain{position:fixed;top:0;left:0;z-index:70;pointer-events:none;filter:drop-shadow(0 3px 4px #8f1f5a33)}
  .rain svg{width:100%;height:100%;display:block}

  #mute{position:fixed;bottom:14px;right:12px;z-index:80;border:0;background:rgba(255,255,255,.55);color:#b0306a;width:38px;height:38px;border-radius:50%;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<!-- símbolo de rosa reutilizable -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="rbase" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#ffb9d2"/><stop offset=".6" stop-color="#f77fa8"/><stop offset="1" stop-color="#df4d7d"/></radialGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd0e1"/><stop offset="1" stop-color="#f57ca4"/></linearGradient>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7bc96f"/><stop offset="1" stop-color="#2f8a45"/></linearGradient>
    <radialGradient id="hl" cx="35%" cy="30%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9e8"/><stop offset="1" stop-color="#f06c9c"/></linearGradient>
    <linearGradient id="bowg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc4da"/><stop offset=".55" stop-color="#ff8fba"/><stop offset="1" stop-color="#ee5f95"/></linearGradient>
    <g id="rose">
      <circle r="31" fill="#d9507f"/>
      <g fill="url(#pg)" stroke="#d8528082" stroke-width=".9">
        <ellipse cy="-20" rx="14" ry="13"/><ellipse cy="-20" rx="14" ry="13" transform="rotate(60)"/><ellipse cy="-20" rx="14" ry="13" transform="rotate(120)"/>
        <ellipse cy="-20" rx="14" ry="13" transform="rotate(180)"/><ellipse cy="-20" rx="14" ry="13" transform="rotate(240)"/><ellipse cy="-20" rx="14" ry="13" transform="rotate(300)"/>
      </g>
      <g fill="url(#pg2)" stroke="#d85280a0" stroke-width=".9">
        <ellipse cy="-13" rx="11.5" ry="10.5" transform="rotate(18)"/><ellipse cy="-13" rx="11.5" ry="10.5" transform="rotate(90)"/>
        <ellipse cy="-13" rx="11.5" ry="10.5" transform="rotate(162)"/><ellipse cy="-13" rx="11.5" ry="10.5" transform="rotate(234)"/><ellipse cy="-13" rx="11.5" ry="10.5" transform="rotate(306)"/>
      </g>
      <g fill="#f98db3" stroke="#d85280" stroke-width=".9">
        <ellipse cy="-7" rx="8.5" ry="8" transform="rotate(30)"/><ellipse cy="-7" rx="8.5" ry="8" transform="rotate(120)"/>
        <ellipse cy="-7" rx="8.5" ry="8" transform="rotate(210)"/><ellipse cy="-7" rx="8.5" ry="8" transform="rotate(300)"/>
      </g>
      <circle r="5" fill="#ee6c98" stroke="#d85280" stroke-width=".8"/>
      <path d="M-3 1 A3.5 3.5 0 1 1 3.5 1 A6 6 0 0 1 -5 3" fill="none" stroke="#c23d6e" stroke-width="1.2" stroke-linecap="round"/>
      <g fill="none" stroke="#b02f65" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round"><path d="M-14 -4 A15 15 0 0 0 4 14"/><path d="M12 -8 A14 14 0 0 1 -2 -16"/><path d="M-9 8 A12 12 0 0 0 11 4"/><path d="M-22 6 A24 24 0 0 0 8 24"/></g>
      <circle r="27" fill="none" stroke="#b83270" stroke-opacity=".22" stroke-width="5"/>
      <circle r="30" fill="url(#hl)"/>
      <path d="M-22 -12 A26 26 0 0 1 -8 -25" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".7"/>
      <circle r="30.5" fill="none" stroke="#a82a5c" stroke-opacity=".3" stroke-width="1.5"/>
    </g>
    <symbol id="bowsym" viewBox="0 0 140 96">
      <path d="M66 70L40 94L60 90L72 76Z" fill="#ffc9de" stroke="#ec6a9c" stroke-width="2" stroke-linejoin="round"/>
      <path d="M74 70L100 94L80 90L68 76Z" fill="#ffc9de" stroke="#ec6a9c" stroke-width="2" stroke-linejoin="round"/>
      <path d="M70 56C34 -6 -6 30 22 64C40 80 64 70 70 56Z" fill="url(#bowg)" stroke="#ec6a9c" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M70 56C106 -6 146 30 118 64C100 80 76 70 70 56Z" fill="url(#bowg)" stroke="#ec6a9c" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M68 54C48 22 24 28 28 52" fill="none" stroke="#ffe3ee" stroke-width="3.4" stroke-linecap="round" opacity=".85"/>
      <path d="M72 54C92 22 116 28 112 52" fill="none" stroke="#ffe3ee" stroke-width="3.4" stroke-linecap="round" opacity=".85"/>
      <path d="M70 56C56 40 38 42 34 54" fill="none" stroke="#e0508a" stroke-width="2" stroke-linecap="round" opacity=".5"/>
      <path d="M70 56C84 40 102 42 106 54" fill="none" stroke="#e0508a" stroke-width="2" stroke-linecap="round" opacity=".5"/>
      <rect x="58" y="46" width="24" height="24" rx="10" fill="url(#bowg)" stroke="#ec6a9c" stroke-width="2.2"/>
      <path d="M62 54C66 50 72 50 76 53" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <div class="hint" id="hint">Toca el regalo…</div>

  <div class="stage" id="stage">
    <div class="ped"><i class="r1"></i><i class="r2"></i><i class="tp"></i></div>
    <div class="shadow"></div>
    <div class="floaters" id="floaters"></div>

    <div class="persp">
      <div class="cube" id="cube">
        <div class="f side front"></div><div class="f side back"></div>
        <div class="f side right"></div><div class="f side left"></div>
        <div class="f bottom"></div>
        <div class="lidwrap">
          <div class="lid out"></div>
          <div class="lid in">
            <svg viewBox="0 0 100 92"><path d="M50 88C20 62 4 46 4 28C4 14 15 5 28 5C38 5 46 11 50 19C54 11 62 5 72 5C85 5 96 14 96 28C96 46 80 62 50 88Z" fill="#ff5c93"/><text x="50" y="50" text-anchor="middle" font-family="Great Vibes,cursive" font-size="20" fill="#fff">Te amo</text></svg>
          </div>
          <div class="bow3d"><svg viewBox="0 0 140 96"><use href="#bowsym"/></svg></div>
        </div>
      </div>
    </div>

    <div class="bouquet" id="bouquet"><div class="sw">
      <svg viewBox="0 0 260 300" id="bq"></svg>
    </div></div>
    <div class="burst" id="burst"></div>
  </div>
</div>

<div class="veil" id="veil">
  <div class="card">
    <div class="badge">❀</div>
    <button class="x" id="x" aria-label="Cerrar">✕</button>
    <small>UN JARDÍN GUARDADO PARA TI</small>
    <h2 id="titulo"></h2><hr>
    <div id="paras"></div>
    <div class="firma" id="firma"></div>
    <button class="btn" id="lluvia">🌷 Lluvia de flores 🌷</button>
  </div>
</div>
<button id="mute" aria-label="Sonido">🔇</button>
<audio id="music" src="musica.mp3" loop preload="auto"></audio>

<script>
/* ======= Personaliza aquí ======= */
const CONFIG={
  titulo:"Para mi Princesa",
  parrafos:[
    "Hay flores que duran apenas unos días, pero lo que siento por ti florece un poco más cada mañana.",
    "Gracias por iluminar mis días con tu sonrisa, por tu calma y por convertir cualquier instante contigo en mi lugar favorito del mundo.",
    "Cuanto más tiempo paso a tu lado, más te amo."
  ],
  firma:"Siempre tuyo",
  etiqueta:"Con amor"
};
/* ================================= */
const $=id=>document.getElementById(id), rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const stage=$('stage'), music=$('music');

/* ---------- flores en SVG ---------- */
function ell(n,cy,rx,ry,fill,off=0,ex=''){let o='';for(let i=0;i<n;i++)o+=`<ellipse cx="0" cy="${-cy}" rx="${rx}" ry="${ry}" fill="${fill}" ${ex} transform="rotate(${off+i*360/n})"/>`;return o}
const dots=(n,r,c)=>{let o='';for(let i=0;i<n;i++){const a=i*6.283/n;o+=`<circle cx="${(Math.cos(a)*r).toFixed(1)}" cy="${(Math.sin(a)*r).toFixed(1)}" r="1.6" fill="${c}"/>`}return o};
const wrap=b=>`<svg viewBox="-50 -50 100 100">${b}</svg>`;
const dahlia=c=>wrap(ell(14,32,9,18,c[0],0,'stroke="rgba(120,20,60,.15)" stroke-width=".6"')+ell(12,24,8,15,c[1],15)+ell(10,16,6.5,12,c[2],0)+ell(8,9,5,8,c[2],20)+'<circle r="5.5" fill="#f4c542"/>'+dots(8,8,'#e09a1a'));
const gerbera=()=>wrap(ell(22,33,5,17,'#e3262e')+ell(18,24,4.5,13,'#c9131c',8)+'<circle r="11" fill="#2b120e"/><circle r="8" fill="none" stroke="#e8b020" stroke-width="2.4" stroke-dasharray="2 2.4"/>');
const lily=()=>wrap(ell(5,28,15,22,'#fff',0,'stroke="#f0c4d4" stroke-width="1"')+ell(5,14,7,12,'#ffd6e4',36)+'<circle r="4" fill="#f4c542"/>'+dots(6,8,'#e09a1a'));
const roseB=()=>wrap('<use href="#rose" transform="scale(1.6)"/>');
const decal=c=>`<svg viewBox="-20 -20 40 40">${ell(5,9.5,6.4,9.5,c,0,'stroke="rgba(200,80,120,.25)" stroke-width=".8"')}<circle r="5.2" fill="#ffd54f" stroke="#f0a020" stroke-width=".8"/><circle r="2" cx="-1.4" cy="-1.6" fill="#fff" opacity=".7"/></svg>`;
const PINK=['#f9a8c6','#f27ba6','#e65a8c'], LIGHT=['#ffd3e1','#ffb7cf','#ff98b9'];
const FLOWERS=[()=>dahlia(PINK),()=>dahlia(LIGHT),gerbera,lily,roseB,()=>dahlia(PINK),gerbera];

/* ---------- decoraciones de la caja ---------- */
const decPos=[[9,12,'#fff'],[11,62,'#ffe3a0'],[70,34,'#ffd1e3'],[68,70,'#fff']];
document.querySelectorAll('.f.side').forEach(f=>{
  decPos.forEach(([l,t,c])=>{const d=document.createElement('div');d.className='dec';d.style.left=l+'%';d.style.top=t+'%';d.innerHTML=decal(c);f.appendChild(d)});
});

/* ---------- ramo de rosas ---------- */
(function(){
  const roses=[[130,52,1],[80,80,.98],[180,80,.98],[48,120,.95],[108,108,1.04],[152,108,1.04],[212,120,.95],[82,150,1],[130,144,1.02],[178,150,1]];
  const leaves=[[28,130,-50],[232,130,50],[50,168,-30],[210,168,30],[130,30,0],[96,36,-40],[164,36,40]];
  let s='';
  s+=`<g stroke="#3c9a4f" stroke-width="6" stroke-linecap="round" fill="none"><path d="M112 195L124 292"/><path d="M130 195L130 297"/><path d="M148 195L138 292"/></g>`;
  leaves.forEach(([x,y,r])=>s+=`<path d="M${x} ${y-40}C${x+20} ${y-14} ${x+17} ${y+20} ${x} ${y+40}C${x-17} ${y+20} ${x-20} ${y-14} ${x} ${y-40}Z" fill="url(#lf)" stroke="#256b38" stroke-width="1" transform="rotate(${r} ${x} ${y})"/>`);
  roses.forEach(([x,y,k])=>s+=`<use href="#rose" transform="translate(${x} ${y}) scale(${k})"/>`);
  s+=`<use href="#bowsym" x="50" y="148" width="164" height="112"/>`;
  s+=`<g transform="rotate(-16 170 252)"><rect x="150" y="238" width="44" height="28" rx="3" fill="#fffaf5" stroke="#dcc2c9"/><text x="172" y="252" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="9" fill="#7a4558">${CONFIG.etiqueta}</text><text x="172" y="262" text-anchor="middle" font-size="8" fill="#e0457b">♥</text></g>`;
  $('bq').innerHTML=s;
})();

/* ---------- carta ---------- */
$('titulo').textContent=CONFIG.titulo; $('firma').textContent=CONFIG.firma;
CONFIG.parrafos.forEach(t=>{const p=document.createElement('div');p.className='para';p.textContent=t;$('paras').appendChild(p)});

/* ---------- pétalos de fondo ---------- */
for(let i=0;i<14;i++){
  const p=document.createElement('div');p.className='petal';
  const w=rnd(6,12);p.style.cssText+=`left:${rnd(0,100)}vw;width:${w}px;height:${w*1.3}px;background:${pick(['#ffd3e1','#fff','#ffb7cf'])}`;
  document.body.appendChild(p);
  p.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${rnd(-80,80)}px,${innerHeight+60}px) rotate(${rnd(200,500)}deg)`}],{duration:rnd(9000,16000),delay:-rnd(0,14000),iterations:Infinity});
}

/* ---------- música ---------- */
/* musica.mp3 ya empieza en el segundo 30 de la canción original */
let autoMuted=false;
function setIcon(){ $('mute').textContent=(music.paused||music.muted)?'🔇':'🔊'; }
function tryPlay(){
  music.volume=.85;
  if(!music.paused){ if(autoMuted){ music.muted=false; autoMuted=false; } setIcon(); return; }
  const p=music.play();
  if(p) p.catch(()=>{ music.muted=true; autoMuted=true; const q=music.play(); if(q)q.catch(()=>{}); });
}
['pointerdown','pointerup','touchstart','touchend','click','keydown','scroll'].forEach(e=>addEventListener(e,tryPlay,{passive:true,capture:true}));
['canplay','loadeddata','visibilitychange'].forEach(e=>(e==='visibilitychange'?document:music).addEventListener(e,tryPlay));
addEventListener('load',tryPlay); addEventListener('pageshow',tryPlay);
music.addEventListener('play',setIcon); music.addEventListener('pause',setIcon); music.addEventListener('volumechange',setIcon);
$('mute').onclick=e=>{e.stopPropagation(); if(music.paused){music.muted=false;autoMuted=false;tryPlay();return;} autoMuted=false; music.muted=!music.muted; setIcon()};
tryPlay();

/* ---------- animación de apertura ---------- */
let opened=false, modal=false;
function burst(){
  const r=stage.getBoundingClientRect(), S=parseFloat(getComputedStyle(stage).getPropertyValue('--s'))||140;
  const real=$('cube').offsetWidth||S;
  for(let i=0;i<36;i++){
    const el=document.createElement('div'), size=real*rnd(.7,1.25);
    el.className='bf'; el.style.cssText+=`width:${size}px;height:${size}px;margin:${-size/2}px 0 0 ${-size/2}px`;
    el.innerHTML=pick(FLOWERS)(); $('burst').appendChild(el);
    const dx=rnd(-r.width*.46,r.width*.46), dy=-rnd(r.height*.06,r.height*.42), rot=rnd(-200,200);
    el.animate([
      {transform:'translate(0,0) scale(.1) rotate(0)',opacity:0},
      {opacity:1,offset:.25},
      {transform:`translate(${dx}px,${dy}px) scale(1) rotate(${rot}deg)`,opacity:1,offset:.72},
      {transform:`translate(${dx*1.06}px,${dy*1.06+40}px) scale(.9) rotate(${rot*1.1}deg)`,opacity:0}
    ],{duration:rnd(2600,3300),delay:rnd(0,380),easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'}).onfinish=()=>el.remove();
  }
  /* flores gigantes que "saltan" hacia la pantalla */
  for(let i=0;i<10;i++){
    const el=document.createElement('div'), size=Math.max(r.width,280)*rnd(.5,.95);
    el.className='bf'; el.style.cssText+=`width:${size}px;height:${size}px;margin:${-size/2}px 0 0 ${-size/2}px;z-index:9`;
    el.innerHTML=pick([()=>dahlia(PINK),()=>dahlia(LIGHT),gerbera,lily,roseB,()=>dahlia(PINK)])(); $('burst').appendChild(el);
    const dx=rnd(-r.width*.4,r.width*.4), dy=-rnd(r.height*.04,r.height*.42), rot=rnd(-60,60);
    el.animate([
      {transform:'translate(0,0) scale(.05) rotate(0)',opacity:0},
      {transform:`translate(${dx*.6}px,${dy*.6}px) scale(.6) rotate(${rot*.5}deg)`,opacity:1,offset:.4},
      {transform:`translate(${dx}px,${dy}px) scale(1) rotate(${rot}deg)`,opacity:1,offset:.7},
      {transform:`translate(${dx*1.1}px,${dy*1.1+30}px) scale(1.15) rotate(${rot*1.2}deg)`,opacity:0}
    ],{duration:rnd(2000,2600),delay:rnd(700,1100),easing:'ease-out',fill:'forwards'}).onfinish=()=>el.remove();
  }
}
function floaters(){
  for(let i=0;i<10;i++){
    const f=document.createElement('div'),s=rnd(18,30);
    f.className='fl';f.style.cssText=`left:${rnd(6,88)}%;top:${rnd(6,46)}%;width:${s}px;height:${s}px;animation-delay:${-rnd(0,4)}s;animation-duration:${rnd(3.5,6)}s`;
    f.innerHTML=pick([()=>dahlia(PINK),gerbera,lily,roseB])(); $('floaters').appendChild(f);
    setTimeout(()=>f.classList.add('show'),rnd(0,1500));
  }
}
function open(){
  if(opened)return; opened=true; tryPlay();
  $('hint').classList.add('hide');
  stage.classList.add('open');
  setTimeout(burst,250);
  setTimeout(()=>$('bouquet').classList.add('show'),2100);
  setTimeout(floaters,3000);
  setTimeout(showModal,7500);
}
function showModal(){ modal=true; $('veil').classList.add('show'); }
function hideModal(){ modal=false; $('veil').classList.remove('show');
  $('hint').textContent='Toca el regalo para releer tu carta 💌'; $('hint').classList.remove('hide'); }
stage.addEventListener('click',()=>{ if(!opened)open(); else if(!modal)showModal(); });
$('x').onclick=hideModal;
$('veil').addEventListener('click',e=>{ if(e.target===$('veil'))hideModal(); });

/* ---------- lluvia de flores ---------- */
function rain(){
  for(let i=0;i<44;i++){
    const el=document.createElement('div'),s=rnd(26,54);
    el.className='rain';el.style.cssText+=`width:${s}px;height:${s}px;left:${rnd(0,innerWidth-s)}px`;
    el.innerHTML=pick(FLOWERS)(); document.body.appendChild(el);
    el.animate([{transform:'translate(0,-70px) rotate(0)'},{transform:`translate(${rnd(-70,70)}px,${innerHeight+90}px) rotate(${rnd(180,600)}deg)`}],
      {duration:rnd(3800,7000),delay:rnd(0,2200),easing:'linear',fill:'forwards'}).onfinish=()=>el.remove();
  }
}
$('lluvia').onclick=rain;
</script>
</body>
